services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: retro_local
      POSTGRES_DB: retrovault
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["retrovault_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro -d retrovault"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  retrovault_pg:
